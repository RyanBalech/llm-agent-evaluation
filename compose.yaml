services:
  repolens:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REPOLENS_TOKEN: ${REPOLENS_TOKEN:?Set REPOLENS_TOKEN before starting the server}
      REPOLENS_HOSTS: ${REPOLENS_HOSTS:-localhost,127.0.0.1}
    volumes:
      - indexes:/data
    mem_limit: 2g
    cpus: 2
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  indexes:

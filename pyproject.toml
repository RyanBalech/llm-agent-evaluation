[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-evaluation"
version = "0.1.0"
description = "Reproducible evaluation of repository retrieval for software-engineering LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
ml = ["torch>=2.4,<3", "transformers>=4.45,<5"]

[project.scripts]
llm-agent-eval = "llm_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-evaluation"
version = "0.1.0"
description = "Reproducible evaluation of repository retrieval for software-engineering LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
ml = ["torch>=2.4,<3", "transformers>=4.45,<5"]
providers = ["mistralai>=1,<2"]
bench = ["datasets>=3,<5"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
llm-agent-eval = "llm_agent_eval.cli:main"
repolens = "llm_agent_eval.app:main"
repolens-mcp = "llm_agent_eval.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_agent_eval = ["static/*", "demo/*.py", "evidence/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
